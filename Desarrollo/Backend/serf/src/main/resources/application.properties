
spring.application.name=serf

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/serf_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=8080

# Configuracion JWT
serf.jwt.secret=${JWT_SECRET}
serf.jwt.expiration=86400000
